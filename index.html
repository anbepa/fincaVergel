<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--seo:start--><!-- per-route title, description, canonical, Open Graph and JSON-LD are injected at build (vite.config.js) --><!--seo:end-->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#111111" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finca El Vergel" />
    <meta name="geo.region" content="CO-MAG" />
    <meta name="geo.placename" content="Ciénaga, Magdalena, Colombia" />
    <meta name="geo.position" content="10.84976;-74.015902" />
    <meta name="ICBM" content="10.84976, -74.015902" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Connect early to the hosts the first screen needs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.squarespace-cdn.com" />

    <!-- Only the families/weights the site actually uses (non-render-blocking) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" /></noscript>

    <!-- Critical CSS: instant branded first paint while JS downloads -->
    <style>
      html, body { margin: 0; background: #111; }
      #splash {
        position: fixed; inset: 0; z-index: 100001;
        display: flex; align-items: center; justify-content: center; gap: 20px;
        background: #111; color: #fff;
        font: 800 clamp(1.2rem, 4vw, 2.2rem)/1 'Barlow Condensed', 'Arial Narrow', sans-serif;
        letter-spacing: 8px; text-transform: uppercase;
        transition: opacity .4s ease, visibility .4s;
      }
      #splash::before, #splash::after {
        content: ''; width: clamp(30px, 8vw, 60px); height: 1px; background: #d8492e;
      }
      #splash.splash--hide { opacity: 0; visibility: hidden; }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
      /* Crawlable fallback content (replaced by the app on load) */
      .seo-fallback { max-width: 720px; margin: 0 auto; padding: 120px 24px; color: #f5e8d9; font-family: system-ui, sans-serif; line-height: 1.6; }
      .seo-fallback a { color: #9cbf6a; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">Finca El Vergel</div>
    <div id="root"></div>
    
    <noscript><p style="color:#fff;font-family:sans-serif;text-align:center;padding:40px">Activa JavaScript para ver Finca El Vergel.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
